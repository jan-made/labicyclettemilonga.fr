# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_usernames:
      - dependabot[bot]
  path_filters:
    - '!bun.lock'
    - '!public/**'
  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: >-
        Next.js site with i18next. Check that new user-facing text goes through translations, that images have alt
        text, and that client components are used only where needed.
chat:
  auto_reply: true
