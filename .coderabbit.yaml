# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings for the labicyclettemilonga.fr Next.js site.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    ignore_usernames:
      - dependabot[bot]
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
  path_filters:
    - '!bun.lock'
    - '!public/**'
  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: >-
        Next.js site with i18next. Check that new user-facing text goes through translations, that images have alt text, and that client components are used only where needed.
knowledge_base:
  code_guidelines:
    enabled: true
chat:
  auto_reply: true
